name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/bw-secrets

  goreleaser-check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - run: goreleaser check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs the full history/changelog
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Version-free copies of the five download-button assets: the
      # releases/latest/download/<name> links in the README need stable
      # names. Byte-identical to the versioned files, so they stay out
      # of checksums.txt (generated by goreleaser before this step).
      - name: Stable-name copies for direct downloads
        run: |
          cd dist
          cp bw-secrets_*_amd64.deb          bw-secrets_linux_amd64.deb
          cp bw-secrets-*.x86_64.rpm         bw-secrets_linux_x86_64.rpm
          cp bw-secrets-*-x86_64.pkg.tar.zst bw-secrets_linux_x86_64.pkg.tar.zst
          cp bw-secrets_*_darwin_all.tar.gz  bw-secrets_darwin_all.tar.gz
          cp bw-secrets_*_windows_amd64.zip  bw-secrets_windows_amd64.zip

      - name: Upload stable-name copies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/bw-secrets_linux_amd64.deb \
            dist/bw-secrets_linux_x86_64.rpm \
            dist/bw-secrets_linux_x86_64.pkg.tar.zst \
            dist/bw-secrets_darwin_all.tar.gz \
            dist/bw-secrets_windows_amd64.zip
